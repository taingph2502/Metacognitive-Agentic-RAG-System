[project]
name = "paper-like-meta-agent-rag-research"
version = "0.1.0"
description = "Research implementation of a paper-like metacognitive RAG loop"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    "elasticsearch>=8.17.0,<9",
    "pymupdf>=1.25.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.13.0",
    "python-docx>=1.1.0",
    "markdown>=3.7",
    "lxml>=5.0.0",
    "gradio>=6.14.0",
]


[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "datasets>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "benchmarks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

